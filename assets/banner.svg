<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="250" rx="20"/></clipPath>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CF8264" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#CF8264" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AE6244" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#AE6244" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6A488" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E6A488" stop-opacity="0"/>
    </radialGradient>

    <!-- rotating gradient for the animated border -->
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="250">
      <stop offset="0%" stop-color="#CF8264" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#2A241F"/>
      <stop offset="55%" stop-color="#2A241F"/>
      <stop offset="100%" stop-color="#E6A488" stop-opacity="0.8"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 450 125" to="360 450 125" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#EFE8DF" opacity="0.05"/>
    </pattern>

    <clipPath id="nameClip">
      <rect x="0" y="60" width="0" height="80">
        <animate attributeName="width" from="0" to="480" dur="1.8s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="900" height="250" fill="#100E0C"/>

    <!-- drifting aurora blobs -->
    <circle cx="140" cy="50" r="180" fill="url(#blob1)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 50 25; -25 35; 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="210" r="200" fill="url(#blob2)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -35 -20; 30 12; 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="20" r="150" fill="url(#blob3)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -20 30; 25 -15; 0 0" dur="21s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="900" height="250" fill="url(#dots)"/>

    <!-- floating particles -->
    <circle cx="640" cy="70" r="2.4" fill="#E6A488">
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;56" dur="4s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="705" cy="150" r="1.8" fill="#CF8264">
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="-2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;134" dur="5s" begin="-2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="588" cy="190" r="2" fill="#EFE8DF">
      <animate attributeName="opacity" values="0;0.55;0" dur="6s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;172" dur="6s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="845" cy="105" r="1.6" fill="#E6A488">
      <animate attributeName="opacity" values="0;0.7;0" dur="4.6s" begin="-3.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="105;92" dur="4.6s" begin="-3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="60" r="1.6" fill="#CF8264">
      <animate attributeName="opacity" values="0;0.6;0" dur="5.4s" begin="-1.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;46" dur="5.4s" begin="-1.7s" repeatCount="indefinite"/>
    </circle>

    <!-- rotating asterisk mark: draws in, then spins -->
    <g transform="translate(806,52)">
      <g stroke="#CF8264" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
        <line x1="0" y1="-24" x2="0" y2="24" stroke-dasharray="48" stroke-dashoffset="48">
          <animate attributeName="stroke-dashoffset" from="48" to="0" dur="0.7s" begin="0.2s" fill="freeze"/>
        </line>
        <line x1="-24" y1="0" x2="24" y2="0" stroke-dasharray="48" stroke-dashoffset="48">
          <animate attributeName="stroke-dashoffset" from="48" to="0" dur="0.7s" begin="0.45s" fill="freeze"/>
        </line>
        <line x1="-17" y1="-17" x2="17" y2="17" stroke-dasharray="48" stroke-dashoffset="48">
          <animate attributeName="stroke-dashoffset" from="48" to="0" dur="0.7s" begin="0.7s" fill="freeze"/>
        </line>
        <line x1="-17" y1="17" x2="17" y2="-17" stroke-dasharray="48" stroke-dashoffset="48">
          <animate attributeName="stroke-dashoffset" from="48" to="0" dur="0.7s" begin="0.95s" fill="freeze"/>
        </line>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="14s" begin="1.8s" repeatCount="indefinite"/>
      </g>
      <circle r="4" fill="#E6A488" opacity="0.9">
        <animate attributeName="r" values="3.4;4.6;3.4" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name: typewriter reveal -->
    <g clip-path="url(#nameClip)">
      <text x="64" y="120" font-family="Georgia, 'Playfair Display', serif" font-size="54"
        fill="#EFE8DF" letter-spacing="0.5">Artem Tarasov</text>
    </g>
    <!-- caret sweeps with the typing, then blinks -->
    <rect x="64" y="82" width="4" height="46" fill="#CF8264" rx="1">
      <animate attributeName="x" from="64" to="452" dur="1.8s" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.5;0.75;1" dur="1.1s" begin="2.2s" repeatCount="indefinite"/>
    </rect>

    <!-- cycling taglines -->
    <text x="66" y="165" font-family="Menlo, Consolas, monospace" font-size="21" fill="#CF8264">
      <tspan opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.30;0.333;1" dur="12s" repeatCount="indefinite"/>
        AI Growth, Automation &amp; Product
      </tspan>
    </text>
    <text x="66" y="165" font-family="Menlo, Consolas, monospace" font-size="21" fill="#CF8264">
      <tspan opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.63;0.667;1" dur="12s" repeatCount="indefinite"/>
        Building AIRA — AI career assistant
      </tspan>
    </text>
    <text x="66" y="165" font-family="Menlo, Consolas, monospace" font-size="21" fill="#CF8264">
      <tspan opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.667;0.687;0.96;1" dur="12s" repeatCount="indefinite"/>
        Technical SEO → Automation → Product
      </tspan>
    </text>

    <!-- underline that draws in under the taglines -->
    <line x1="66" y1="180" x2="426" y2="180" stroke="#2A241F" stroke-width="2"/>
    <line x1="66" y1="180" x2="426" y2="180" stroke="#CF8264" stroke-width="2" stroke-linecap="round"
      stroke-dasharray="60 300" stroke-dashoffset="360">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </line>

    <text x="66" y="214" font-family="Arial, sans-serif" font-size="15" fill="#ABA299">Moscow · Financial University · Business Informatics</text>
  </g>

  <rect x="1" y="1" width="898" height="248" rx="19" fill="none" stroke="url(#border)" stroke-width="1.6"/>
</svg>
